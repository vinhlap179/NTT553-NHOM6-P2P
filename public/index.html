<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test WebRTC P2P</title>
</head>
<body style="font-family: Arial; padding: 20px;">
    <h2>Test WebRTC Giai đoạn 1</h2>
    
    <div style="margin-bottom: 20px; padding: 10px; border: 1px solid #ccc;">
        <h3>Người gửi (Sender)</h3>
        <button id="btnCreateRoom">1. Tạo Phòng</button>
        <p>Mã phòng của bạn: <strong id="myRoomId" style="color: blue; font-size: 20px;"></strong></p>
    </div>

    <div style="margin-bottom: 20px; padding: 10px; border: 1px solid #ccc;">
        <h3>Người nhận (Receiver)</h3>
        <input type="text" id="inputRoomId" placeholder="Nhập mã phòng...">
        <button id="btnJoinRoom">2. Vào Phòng</button>
    </div>

    <div style="padding: 10px; border: 1px solid #ccc; background: #f9f9f9;">
        <h3>Kết nối P2P (DataChannel)</h3>
        <button id="btnSendMsg" disabled>3. Gửi "Hello World"</button>
        <p>Trạng thái: <span id="status">Chưa kết nối</span></p>
        <p>Tin nhắn nhận được: <strong id="msgReceived" style="color: green;"></strong></p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
